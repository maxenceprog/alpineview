---
api_domain: api.alpineview.example.com
certbot_email: changeme@example.com

repo_url: https://github.com/maxenceprog/alpineview.git
repo_version: master

app_user: alpineview
app_home: /opt/alpineview-api
venv_dir: /opt/alpineview-api/venv
data_dir: /var/lib/alpineview
api_port: 8000
uvicorn_workers: 2

allowed_origins: "https://maxenceprog.github.io"

# nginx per-IP rate limit
ratelimit_rate: 30r/s
ratelimit_burst: 60
