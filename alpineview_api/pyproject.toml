[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpineviewapi"
version = "0.1.0"
description = "Tile server (tiles, buildings, vegetation) for alpineview"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
include = ["alpineviewapi*"]
