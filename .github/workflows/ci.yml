name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
        working-directory: webapp
      - run: npm run lint
        working-directory: webapp

  alpineview_builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
      - uses: actions/cache@v4
        with:
          path: ${{ env.CONDA }}/envs/lidalps3d
          key: conda-lidalps3d-${{ hashFiles('alpineview_builder/environment.yml') }}
      - uses: actions/cache@v4
        with:
          path: |
            alpineview_builder/build/release
            alpineview_builder/third-parties/PoissonRecon/Bin
          key: build-${{ hashFiles('alpineview_builder/src/**', 'alpineview_builder/CMakeLists.txt', 'alpineview_builder/third-parties/PoissonRecon/**') }}
          restore-keys: build-
      - run: alpineview_builder/build_all.sh
        shell: bash -l {0}
      - run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate lidalps3d
          pip install ./python
          python python/tests/test_runner.py
        shell: bash -l {0}
        working-directory: alpineview_builder

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
        working-directory: webapp
      - run: npm audit --audit-level=high
        working-directory: webapp
