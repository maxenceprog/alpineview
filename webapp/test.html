<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wm/terrain tileset test</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #10131a;
      }
      #info {
        position: absolute;
        top: 0;
        left: 0;
        padding: 8px 12px;
        font: 12px/1.5 monospace;
        color: #cfd6e4;
        background: rgba(16, 19, 26, 0.75);
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="info">loading…</div>
    <script type="module">
      import * as THREE from "three";
      import { TilesRenderer } from "3d-tiles-renderer";
      import {
        GLTFExtensionsPlugin,
        DebugTilesPlugin,
      } from "3d-tiles-renderer/plugins";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
      import { applySkirtAndNormals } from "./src/tileSkirtAndNormals.js";

      const TILESET_URL = "/wm/terrain/tileset_test.json";

      let rootTransform = null;

      const info = document.getElementById("info");
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x10131a);
      scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x2a2118, 2.2));
      const sun = new THREE.DirectionalLight(0xffffff, 2.0);
      sun.position.set(-0.6, 0.5, 1.0);
      scene.add(sun);

      const camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        1,
        60000,
      );
      camera.position.set(1200, -1800, 1600);
      camera.up.set(0, 0, 1);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const dracoLoader = new DRACOLoader().setDecoderPath("/draco/");

      const tiles = new TilesRenderer(TILESET_URL);
      tiles.registerPlugin(new GLTFExtensionsPlugin({ dracoLoader }));
      const debug = new DebugTilesPlugin({
        displayBoxBounds: true,
        displaySphereBounds: false,
      });
      tiles.registerPlugin(debug);
      tiles.setCamera(camera);
      tiles.setResolutionFromRenderer(camera, renderer);

      scene.add(tiles.group);

      const LAYERS = {
        shade: ["IGNF_LIDAR-HD_MNT_ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW", "png"],
        ortho: ["ORTHOIMAGERY.ORTHOPHOTOS", "jpeg"],
        plan: ["GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2", "png"],
        slopes: ["GEOGRAPHICALGRIDSYSTEMS.SLOPES.MOUNTAIN", "png"],
      };
      const params = new URLSearchParams(location.search);
      const [WMTS_LAYER, WMTS_EXT] =
        LAYERS[params.get("layer")] || LAYERS.shade;
      const WMTS_FORMAT = "image%2F" + WMTS_EXT;
      const WMQ_EXTENT = 20037508.342789244;
      const MERC_R = 6378137.0;
      const GRS80_A = 6378137.0;
      const GRS80_F = 1 / 298.257222101;
      const GRS80_E2 = 2 * GRS80_F - GRS80_F * GRS80_F;

      const tileUrl = (x, y, z) =>
        `https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0` +
        `&LAYER=${WMTS_LAYER}&STYLE=normal&FORMAT=${WMTS_FORMAT}` +
        `&TILEMATRIXSET=PM_0_19&TILEMATRIX=${z}&TILEROW=${y}&TILECOL=${x}`;

      function mercBounds(z, x, y) {
        const s = (2 * WMQ_EXTENT) / 2 ** z;
        const x0 = -WMQ_EXTENT + x * s;
        const y1 = WMQ_EXTENT - y * s;
        return { x0, y0: y1 - s, s };
      }

      function ecefToMerc(p) {
        const r = Math.hypot(p.x, p.y);
        const lon = Math.atan2(p.y, p.x);
        let lat = Math.atan2(p.z, r * (1 - GRS80_E2));
        for (let i = 0; i < 5; i++) {
          const n = GRS80_A / Math.sqrt(1 - GRS80_E2 * Math.sin(lat) ** 2);
          const h = r / Math.cos(lat) - n;
          lat = Math.atan2(p.z, r * (1 - (GRS80_E2 * n) / (n + h)));
        }
        return {
          x: lon * MERC_R,
          y: Math.log(Math.tan(Math.PI / 4 + lat / 2)) * MERC_R,
        };
      }

      function flipNormalsIfFacingDown(geometry) {
        const n = geometry.attributes.normal;
        if (!n) return;
        let zsum = 0;
        for (let i = 0; i < n.count; i++) zsum += n.getZ(i);
        if (zsum >= 0) return;
        const a = n.array;
        for (let i = 0; i < a.length; i++) a[i] = -a[i];
        n.needsUpdate = true;
      }

      const textureLoader = new THREE.TextureLoader();
      textureLoader.setCrossOrigin("anonymous");

      const LIT = params.has("lit");

      const fallback = LIT
        ? new THREE.MeshStandardMaterial({
            color: 0x9a8f7d,
            roughness: 1,
            metalness: 0,
          })
        : new THREE.MeshBasicMaterial({
            color: 0x9a8f7d,
            side: THREE.DoubleSide,
          });

      const RAW = params.has("raw");

      tiles.addEventListener("load-model", ({ scene: model, url }) => {
        if (RAW) {
          model.traverse((o) => {
            if (!o.isMesh) return;
            o.geometry.computeVertexNormals();
            o.material = new THREE.MeshNormalMaterial({
              side: THREE.DoubleSide,
            });
            const p = o.geometry.attributes.position;
            console.log(
              url.split("/").pop(),
              "verts",
              p.count,
              "type",
              p.array.constructor.name,
              "normalized",
              p.normalized,
              "local x",
              p.array[0].toFixed(1),
              p.array[1].toFixed(1),
              p.array[2].toFixed(1),
              "indexed",
              !!o.geometry.index,
            );
          });
          return;
        }
        const m = /tile\.(\d+)\.(\d+)\.(\d+)\.glb/.exec(url);
        if (!m) return;
        const [x, y, z] = [+m[1], +m[2], +m[3]];
        const { x0, y0, s } = mercBounds(z, x, y);
        const toEcef = new THREE.Matrix4()
          .fromArray(rootTransform)
          .multiply(new THREE.Matrix4().makeRotationX(Math.PI / 2));
        const p = new THREE.Vector3();

        model.traverse((o) => {
          if (!o.isMesh) return;
          try {
            applySkirtAndNormals(o.geometry);
            flipNormalsIfFacingDown(o.geometry);
          } catch (err) {
            console.error("normals failed", err);
            o.geometry.computeVertexNormals();
          }
          const pos = o.geometry.attributes.position;
          const uv = new Float32Array(pos.count * 2);
          for (let i = 0; i < pos.count; i++) {
            p.fromBufferAttribute(pos, i).applyMatrix4(toEcef);
            const q = ecefToMerc(p);
            uv[2 * i] = (q.x - x0) / s;
            uv[2 * i + 1] = (q.y - y0) / s;
          }
          o.geometry.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
          o.material = fallback;
          textureLoader.load(
            tileUrl(x, y, z),
            (tex) => {
              tex.colorSpace = THREE.SRGBColorSpace;
              tex.anisotropy = 8;
              tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
              o.material = LIT
                ? new THREE.MeshStandardMaterial({
                    map: tex,
                    roughness: 1,
                    metalness: 0,
                  })
                : new THREE.MeshBasicMaterial({
                    map: tex,
                    side: THREE.DoubleSide,
                  });
            },
            undefined,
            () => console.warn("no imagery for", z, x, y),
          );
        });
      });

      tiles.addEventListener("load-tileset", ({ tileSet }) => {
        rootTransform = tileSet.root.transform;
        const M = new THREE.Matrix4().fromArray(rootTransform);
        const east = new THREE.Vector3().setFromMatrixColumn(M, 0).normalize();
        const north = new THREE.Vector3().setFromMatrixColumn(M, 1).normalize();
        const up = new THREE.Vector3().setFromMatrixColumn(M, 2).normalize();

        const sphere = new THREE.Sphere();
        if (!tiles.getBoundingSphere(sphere)) return;
        const c = sphere.center.clone().applyMatrix4(tiles.group.matrixWorld);
        const r = sphere.radius;

        camera.near = r / 100;
        camera.far = r * 100;
        camera.up.copy(up);
        camera.position
          .copy(c)
          .addScaledVector(east, 0.6 * r)
          .addScaledVector(north, -1.3 * r)
          .addScaledVector(up, 0.9 * r);
        camera.updateProjectionMatrix();
        controls.target.copy(c);
        controls.update();

        sun.position.copy(up).addScaledVector(east, -0.6).addScaledVector(north, -0.5);

        console.log("centre", c.toArray(), "radius", r);
      });

      tiles.addEventListener("load-error", (e) =>
        console.error("tile-load-error", e.url, e.error),
      );

      tiles.addEventListener("load-model", ({ scene: model, url }) => {
        const b = new THREE.Box3().setFromObject(model);
        console.log(
          "loaded",
          url.split("/").pop(),
          "world box",
          b.min.toArray().map(Math.round),
          b.max.toArray().map(Math.round),
        );
      });

      window.frame = () => {
        const b = new THREE.Box3().setFromObject(tiles.group);
        if (b.isEmpty()) {
          console.warn("group box empty, nothing loaded");
          return;
        }
        const c = b.getCenter(new THREE.Vector3());
        const r = b.getSize(new THREE.Vector3()).length() / 2;
        const dir = c.clone().normalize();
        camera.up.copy(dir);
        camera.near = r / 100;
        camera.far = r * 100;
        camera.position.copy(c).addScaledVector(dir, 2 * r);
        camera.lookAt(c);
        camera.updateProjectionMatrix();
        controls.target.copy(c);
        controls.update();
        console.log("framed on", c.toArray(), "r", r);
      };

      setInterval(() => {
        const b = new THREE.Box3().setFromObject(tiles.group);
        console.log(
          "visible",
          tiles.visibleTiles.size,
          "stats",
          JSON.stringify(tiles.stats),
          "groupBoxEmpty",
          b.isEmpty(),
          "camDistToBox",
          b.isEmpty() ? "-" : b.distanceToPoint(camera.position).toFixed(1),
        );
      }, 2000);

      window.dumpScene = () => {
        let meshes = 0;
        tiles.group.traverse((o) => {
          if (o.isMesh) meshes++;
        });
        const b = new THREE.Box3().setFromObject(tiles.group);
        console.log("meshes in group:", meshes);
        console.log("group world box:", b.min.toArray(), b.max.toArray());
        console.log("camera:", camera.position.toArray(), "target:", controls.target.toArray());
        console.log("stats:", JSON.stringify(tiles.stats));
      };

      window.tiles = tiles;
      window.scene = scene;

      addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        tiles.setResolutionFromRenderer(camera, renderer);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        camera.updateMatrixWorld();
        tiles.update();
        renderer.render(scene, camera);
        const g = tiles.stats;
        info.textContent =
          TILESET_URL +
          "\n" +
          (RAW ? "raw geometry (no drape)" : WMTS_LAYER) +
          "\ndownloading " +
          g.downloading +
          "  parsing " +
          g.parsing +
          "  visible " +
          tiles.visibleTiles.size +
          "\nENU frame, +Z up, orbit to inspect";
      }
      animate();
    </script>
  </body>
</html>
