<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>montagne3d.fr — iTowns</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      #viewerDiv {
        width: 100%;
        height: 100%;
      }
      #env-toggle,
      #layer-toggle {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 11;
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 8px;
        background: rgba(10, 20, 35, 0.75);
        color: #dde6f0;
        font-size: 16px;
        cursor: pointer;
      }
      #layer-toggle {
        left: 52px;
      }
      #env-panel {
        position: fixed;
        top: 52px;
        left: 10px;
        z-index: 10;
        background: rgba(10, 20, 35, 0.75);
        color: #dde6f0;
        font: 12px system-ui, sans-serif;
        padding: 10px 12px;
        border-radius: 8px;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 6px 8px;
        align-items: center;
      }
      #env-panel input[type="range"] {
        width: 110px;
      }
      #env-panel.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="viewerDiv"></div>
    <button id="env-toggle" title="Sun / fog settings">🌤</button>
    <button id="layer-toggle" title="Ortho / Plan IGN">🗺</button>
    <div id="env-panel">
      <label for="env-enabled">Lighting</label>
      <input type="checkbox" id="env-enabled" checked />
      <span></span>
      <label for="sun-date">Date</label>
      <input type="date" id="sun-date" />
      <span></span>
      <label for="sun-time">Time</label>
      <input type="range" id="sun-time" min="0" max="1425" step="15" value="720" />
      <span id="sun-time-value">12:00</span>
      <label for="brightness">Brightness</label>
      <input type="range" id="brightness" min="0.5" max="2" step="0.05" value="1.2" />
      <span id="brightness-value">1.20</span>
      <label for="fog-density">Fog</label>
      <input type="range" id="fog-density" min="0" max="0.5" step="0.01" value="0.05" />
      <span id="fog-density-value">0.05</span>
    </div>
    <script type="module" src="/src/itowns/main.js"></script>
  </body>
</html>
